<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#0B1F3A;background:#fff;-webkit-font-smoothing:antialiased}a{color:#0B1F3A}a:hover{color:#14294A}input,select,textarea,button{font-family:inherit}</style></helmet>
<header style="background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #E7EAF0">
  <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Home.dc.html" aria-label="YALA Realty &amp; Associates — home" style="display:flex;flex-direction:column;text-decoration:none;color:#0B1F3A;line-height:1;flex:none" style-focus="outline:3px solid #C9A961;outline-offset:4px;border-radius:2px">
      <span style="font:500 28px/1 'Cormorant Garamond',serif;letter-spacing:.22em">YALA</span>
      <span style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#8A6D2F;margin-top:5px">Realty &amp; Associates</span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Primary" style="display:flex;gap:30px">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" style="text-decoration:none;font:600 14.5px Manrope,sans-serif;color:{{ l.color }};padding:6px 0;border-bottom:2px solid {{ l.line }}" style-hover="color:#0B1F3A" style-focus="outline:3px solid #C9A961;outline-offset:4px;border-radius:2px">{{ l.label }}</a>
        </sc-for>
      </nav>
      <div style="display:flex;align-items:center;gap:10px;flex:none">
        <a href="Sell.dc.html#valuation" style="text-decoration:none;font:700 14px Manrope,sans-serif;color:#0B1F3A;height:44px;display:inline-flex;align-items:center;padding:0 18px;border:1.5px solid #D5D9E1;border-radius:8px;background:#fff" style-hover="border-color:#0B1F3A" style-focus="outline:3px solid #C9A961;outline-offset:2px">Get Home Valuation</a>
        <a href="Contact.dc.html" style="text-decoration:none;font:700 14px Manrope,sans-serif;color:#fff;background:#0B1F3A;height:44px;display:inline-flex;align-items:center;padding:0 20px;border-radius:8px" style-hover="background:#14294A" style-focus="outline:3px solid #C9A961;outline-offset:2px">Book Consultation</a>
      </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:6px">
        <a href="Contact.dc.html" style="text-decoration:none;font:700 13px Manrope,sans-serif;color:#fff;background:#0B1F3A;height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:8px" style-focus="outline:3px solid #C9A961;outline-offset:2px">Consult</a>
        <button type="button" onClick="{{ toggle }}" aria-label="Toggle menu" aria-expanded="{{ menuOpen }}" style="width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:transparent;border:0;border-radius:8px;cursor:pointer;padding:0" style-focus="outline:3px solid #C9A961;outline-offset:2px">
          <span style="display:block;width:20px;height:2px;background:#0B1F3A"></span><span style="display:block;width:20px;height:2px;background:#0B1F3A"></span><span style="display:block;width:20px;height:2px;background:#0B1F3A"></span>
        </button>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Mobile" style="border-top:1px solid #E7EAF0;padding:8px 24px 24px;display:flex;flex-direction:column;background:#fff">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" style="display:flex;align-items:center;min-height:50px;font:600 17px Manrope,sans-serif;color:{{ l.color }};text-decoration:none;border-bottom:1px solid #F1F3F6" style-focus="outline:3px solid #C9A961;outline-offset:-3px">{{ l.label }}</a>
      </sc-for>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
        <a href="Sell.dc.html#valuation" style="text-decoration:none;font:700 15px Manrope,sans-serif;color:#0B1F3A;height:50px;display:flex;align-items:center;justify-content:center;border:1.5px solid #D5D9E1;border-radius:10px">Get Home Valuation</a>
        <a href="Contact.dc.html" style="text-decoration:none;font:700 15px Manrope,sans-serif;color:#fff;background:#0B1F3A;height:50px;display:flex;align-items:center;justify-content:center;border-radius:10px">Book Consultation</a>
        <a href="tel:9495221103" style="text-decoration:none;font:600 15px Manrope,sans-serif;color:#374151;text-align:center;padding:10px">Call (949) 522-1103</a>
      </div>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Buy&quot;,&quot;Sell&quot;,&quot;Listings&quot;,&quot;About&quot;,&quot;Blog&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;breakpoint&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;min&quot;:600,&quot;max&quot;:1400,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { open: false, w: 1280 };
  componentDidMount() { this._r = () => this.setState({ w: window.innerWidth }); this._r(); window.addEventListener('resize', this._r); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const active = this.props.active ?? '';
    const bp = this.props.breakpoint ?? 1000;
    const links = [['Buy', 'Buy.dc.html'], ['Sell', 'Sell.dc.html'], ['Listings', 'Listings.dc.html'], ['About', 'About.dc.html'], ['Blog', 'Blog.dc.html'], ['Contact', 'Contact.dc.html']]
      .map(([label, href]) => ({ label, href, color: label === active ? '#0B1F3A' : '#374151', line: label === active ? '#C9A961' : 'transparent' }));
    const mobile = this.state.w < bp;
    return { links, isDesktop: !mobile, isMobile: mobile, menuOpen: mobile && this.state.open, toggle: () => this.setState(s => ({ open: !s.open })) };
  }
}
</script>
</body>
</html>
